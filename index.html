<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Master System - Step 3</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: #eef2f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .mobile-container { background: #ffffff; width: 100%; max-width: 430px; min-height: 100vh; box-shadow: 0 15px 35px rgba(15, 23, 42, 0.12); display: flex; flex-direction: column; }
        .auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px 20px; flex: 1; text-align: center; }
        .activ-icon { font-size: 50px; color: #0d9488; margin-bottom: 15px; }
        .activ-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .auth-form { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: left; }
        .field-label { font-size: 0.82rem; color: #475569; margin-bottom: 6px; font-weight: 700; display: block; }
        .input-wrapper { background-color: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 4px 10px; }
        .input-wrapper input, .input-wrapper select { width: 100%; border: none; outline: none; padding: 8px 0; font-size: 0.92rem; font-weight: 600; color: #0f172a; background: transparent; }
        .btn-main { width: 100%; background: #0d9488; color: white; border: none; border-radius: 14px; padding: 14px; font-size: 0.98rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .header { background: #0f172a; color: white; padding: 20px; text-align: center; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; position: relative; }
        .content { padding: 20px; flex: 1; overflow-y: auto; }
        .menu-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .group-card { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 14px; text-align: left; }
        .back-btn { position: absolute; top: 20px; left: 15px; background: rgba(255,255,255,0.15); color: #fff; border: none; padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; }
        .patient-card { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="mobile-container">
    <!-- شاشة تسجيل الدخول -->
    <div id="authScreen" class="auth-screen">
        <div class="activ-icon"><i class="fa-solid fa-user-doctor"></i></div>
        <div class="activ-title">تسجيل دخول المؤسس</div>
        <p style="color: #64748b; font-size: 0.85rem;" id="systemStatus">النظام جاهز</p>

        <div class="auth-form">
            <div class="field-box">
                <span class="field-label">البريد الإلكتروني</span>
                <div class="input-wrapper"><input type="email" id="authEmail" value="musqaqa009@gmail.com"></div>
            </div>
            <div class="field-box">
                <span class="field-label">كلمة المرور</span>
                <div class="input-wrapper"><input type="password" id="authPassword" placeholder="أدخل كلمة المرور"></div>
            </div>
            <button type="button" class="btn-main" onclick="executeLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div id="appContainer" style="display: none; flex: 1; flex-direction: column;">
        <div class="header">
            <button id="backBtn" class="back-btn" onclick="showMainMenu()" style="display: none;"><i class="fa-solid fa-arrow-left"></i> الرئيسية</button>
            <h2 id="headerTitle">لوحة تحكم العيادة</h2>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;" id="headerSub">مرحباً بالمهندس قيس</p>
        </div>

        <div class="content">
            <!-- القائمة الرئيسية -->
            <div id="mainMenuScreen" class="main-menu">
                <div class="menu-card" onclick="openAddPatient()">
                    <i class="fa-solid fa-user-plus" style="font-size: 24px; color: #0d9488;"></i>
                    <div>
                        <h3>تسجيل مريض جديد</h3>
                        <p style="font-size: 0.75rem; color: #64748b;">إضافة بيانات مريض جديد للعيادة</p>
                    </div>
                </div>

                <div class="menu-card" onclick="openArchive()">
                    <i class="fa-solid fa-address-book" style="font-size: 24px; color: #0284c7;"></i>
                    <div>
                        <h3>أرشيف المرضى</h3>
                        <p style="font-size: 0.75rem; color: #64748b;">عرض والبحث في قائمة المرضى</p>
                    </div>
                </div>

                <button class="btn-main" style="background: #ef4444; margin-top: 20px;" onclick="executeLogout()">تسجيل الخروج</button>
            </div>

            <!-- شاشة إضافة مريض -->
            <div id="addPatientScreen" style="display: none;">
                <form onsubmit="savePatient(event)">
                    <div class="group-card">
                        <h3 style="margin-bottom: 12px; font-size: 1.05rem; color: #0f172a;"><i class="fa-solid fa-id-card"></i> معلومات المريض</h3>
                        
                        <div class="field-box" style="margin-bottom: 10px;">
                            <span class="field-label">اسم المريض الكامل</span>
                            <div class="input-wrapper"><input type="text" id="pName" placeholder="أدخل اسم المريض..." required></div>
                        </div>

                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                            <div class="field-box" style="flex: 1; margin-bottom:0;">
                                <span class="field-label">العمر</span>
                                <div class="input-wrapper"><input type="number" id="pAge" placeholder="العمر" required></div>
                            </div>
                            <div class="field-box" style="flex: 1; margin-bottom:0;">
                                <span class="field-label">الجنس</span>
                                <div class="input-wrapper">
                                    <select id="pGender">
                                        <option value="ذكر">ذكر</option>
                                        <option value="أنثى">أنثى</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="field-box" style="margin-bottom: 10px;">
                            <span class="field-label">رقم الهاتف</span>
                            <div class="input-wrapper"><input type="tel" id="pPhone" placeholder="07XXXXXXXXX"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn-main"><i class="fa-solid fa-floppy-disk"></i> حفظ المريض</button>
                </form>
            </div>

            <!-- شاشة أرشيف المرضى -->
            <div id="archiveScreen" style="display: none;">
                <div class="field-box" style="margin-bottom: 14px;">
                    <div class="input-wrapper"><input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو رقم الهاتف..." oninput="filterPatients()"></div>
                </div>
                <div id="patientsListContainer"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCgS-TYiCiVIjUrPSkf_z4U837v8LoRUMY",
        authDomain: "mustafaqais-31e2c.firebaseapp.com",
        projectId: "mustafaqais-31e2c",
        storageBucket: "mustafaqais-31e2c.firebasestorage.app",
        messagingSenderId: "835445727081",
        appId: "1:835445727081:web:f5ba7a8d8a241fcbe627f8",
        measurementId: "G-DL042BQE94"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const FOUNDER_EMAIL = "musqaqa009@gmail.com";
    let patients = JSON.parse(localStorage.getItem('clinic_patients')) || [
        { id: 1, name: "أحمد علي", age: 35, gender: "ذكر", phone: "07701234567" },
        { id: 2, name: "فاطمة حسن", age: 28, gender: "أنثى", phone: "07809876543" }
    ];

    auth.onAuthStateChanged(user => {
        if (user && user.email.toLowerCase() === FOUNDER_EMAIL.toLowerCase()) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
        }
    });

    function executeLogin() {
        const email = document.getElementById('authEmail').value.trim();
        const pass = document.getElementById('authPassword').value;

        if (!pass) {
            alert('الرجاء إدخال كلمة المرور!');
            return;
        }

        auth.signInWithEmailAndPassword(email, pass)
            .then(() => {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
            })
            .catch((error) => {
                alert('فشل تسجيل الدخول:\n' + error.message);
            });
    }

    function executeLogout() {
        auth.signOut().then(() => {
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('authScreen').style.display = 'flex';
        });
    }

    function openAddPatient() {
        document.getElementById('mainMenuScreen').style.display = 'none';
        document.getElementById('archiveScreen').style.display = 'none';
        document.getElementById('addPatientScreen').style.display = 'block';
        document.getElementById('backBtn').style.display = 'block';
        document.getElementById('headerTitle').innerText = 'تسجيل مريض جديد';
    }

    function openArchive() {
        document.getElementById('mainMenuScreen').style.display = 'none';
        document.getElementById('addPatientScreen').style.display = 'none';
        document.getElementById('archiveScreen').style.display = 'block';
        document.getElementById('backBtn').style.display = 'block';
        document.getElementById('headerTitle').innerText = 'أرشيف المرضى';
        renderPatientsList(patients);
    }

    function showMainMenu() {
        document.getElementById('addPatientScreen').style.display = 'none';
        document.getElementById('archiveScreen').style.display = 'none';
        document.getElementById('mainMenuScreen').style.display = 'flex';
        document.getElementById('backBtn').style.display = 'none';
        document.getElementById('headerTitle').innerText = 'لوحة تحكم العيادة';
    }

    function savePatient(e) {
        e.preventDefault();
        const newP = {
            id: Date.now(),
            name: document.getElementById('pName').value,
            age: Number(document.getElementById('pAge').value),
            gender: document.getElementById('pGender').value,
            phone: document.getElementById('pPhone').value || 'بدون هاتف'
        };

        patients.unshift(newP);
        localStorage.setItem('clinic_patients', JSON.stringify(patients));
        alert('تم حفظ المريض بنجاح!');
        document.getElementById('pName').value = '';
        document.getElementById('pAge').value = '';
        document.getElementById('pPhone').value = '';
        showMainMenu();
    }

    function renderPatientsList(list) {
        const container = document.getElementById('patientsListContainer');
        if (list.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#64748b; margin-top:20px;">لا يوجد مرضى محفوظين.</p>';
            return;
        }

        container.innerHTML = list.map(p => `
            <div class="patient-card">
                <div>
                    <h4 style="font-size: 1rem; color: #0f172a; margin-bottom: 2px;">${p.name}</h4>
                    <p style="font-size: 0.78rem; color: #64748b;"><i class="fa-solid fa-phone"></i> ${p.phone} | العمر: ${p.age} سنة</p>
                </div>
                <span style="background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold;">${p.gender}</span>
            </div>
        `).join('');
    }

    function filterPatients() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = patients.filter(p => p.name.toLowerCase().includes(q) || p.phone.includes(q));
        renderPatientsList(filtered);
    }
</script>

</body>
</html>
