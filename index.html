<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Master System - Cloud Ultimate Edition v17.05</title>
    <!-- مكتبة Firebase (الإصدار 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
        }

        body {
            background-color: var(--bg-color);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- أنماط صفحة المصادقة --- */
        #auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .auth-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-weight: bold;
            font-size: 13px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-color);
        }

        .btn-primary, .btn-success, .btn-danger {
            width: 100%;
            padding: 12px;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-primary { background: var(--primary-color); }
        .btn-primary:hover { background: #2980b9; }

        .btn-success { background: var(--success-color); }
        .btn-success:hover { background: #27ae60; }

        .btn-danger { background: #e74c3c; width: auto; padding: 6px 12px; font-size: 13px; margin-top: 0;}
        .btn-danger:hover { background: #c0392b; }

        .switch-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .switch-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        /* --- أنماط النظام الرئيسي (مخفي حتى يتم تسجيل الدخول) --- */
        #app-wrapper {
            display: none;
            padding: 20px;
        }

        header {
            background: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .main-content {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- قسم تسجيل الدخول وإنشاء الحساب -->
    <div id="auth-wrapper">
        <div class="auth-container">
            <!-- نموذج تسجيل الدخول -->
            <div id="login-section" class="auth-box">
                <h2>تسجيل الدخول للنظام</h2>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="login-email" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" id="login-password" required placeholder="********">
                    </div>
                    <button type="submit" class="btn-primary">دخول</button>
                </form>
                <p class="switch-text">
                    ليس لديك حساب عيادة؟ <a href="#" onclick="showRegisterSection()">إنشاء حساب جديد</a>
                </p>
            </div>

            <!-- نموذج إنشاء الحساب -->
            <div id="register-section" class="auth-box" style="display: none;">
                <h2>إنشاء حساب عيادة جديد</h2>
                <form id="register-form" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>اسم الطبيب / العيادة</label>
                        <input type="text" id="reg-name" required placeholder="د. أحمد / عيادة الشفاء">
                    </div>
                    <div class="form-group">
                        <label>التخصص الطبي</label>
                        <input type="text" id="reg-specialty" required placeholder="باطنية، أسنان، أطفال...">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="reg-phone" required placeholder="07xxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="reg-email" required placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور</label>
                        <input type="password" id="reg-password" required placeholder="********">
                    </div>
                    <button type="submit" class="btn-success">تسجيل الحساب</button>
                </form>
                <p class="switch-text">
                    لديك حساب بالفعل؟ <a href="#" onclick="showLoginSection()">تسجيل الدخول</a>
                </p>
            </div>
        </div>
    </div>

    <!-- قسم النظام الرئيسي (يظهر بعد تسجيل الدخول) -->
    <div id="app-wrapper">
        <header>
            <div>
                <h2 id="clinic-title" style="margin: 0; color: var(--text-color);">Clinic Master System</h2>
                <small id="doctor-specialty" style="color: #7f8c8d;"></small>
            </div>
            <div>
                <button class="btn-danger" onclick="handleLogout()">تسجيل الخروج</button>
            </div>
        </header>

        <div class="main-content">
            <h3>لوحة التحكم الرئيسية</h3>
            <p>أهلاً بك في نظام إدارة العيادات السحابي. يمكنك الآن إدارة المرضى، الوصفات الطبية، والتقارير.</p>
            <!-- يمكنك وضع محتوى النظام الأساسي الخاص بك هنا -->
        </div>
    </div>

    <script>
        // إعدادات اتصال Firebase (قم بوضع بيانات مشروعك الفعلي هنا)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();

        // مراقبة حالة المصادقة (هل المستخدم مسجل دخول أم لا)
        auth.onAuthStateChanged((user) => {
            if (user) {
                // المستخدم مسجل الدخول -> إخفاء المصادقة وإظهار النظام
                document.getElementById('auth-wrapper').style.display = 'none';
                document.getElementById('app-wrapper').style.display = 'block';
                
                // جلب بيانات العيادة/الطبيب من Firestore
                loadDoctorData(user.uid);
            } else {
                // المستخدم غير مسجل -> إظهار واجهة تسجيل الدخول وإخفاء النظام
                document.getElementById('auth-wrapper').style.display = 'flex';
                document.getElementById('app-wrapper').style.display = 'none';
            }
        });

        // جلب بيانات الطبيب وتحديث الواجهة
        function loadDoctorData(uid) {
            db.collection('doctors').doc(uid).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('clinic-title').innerText = data.fullName || "Clinic Master System";
                    document.getElementById('doctor-specialty').innerText = "التخصص: " + (data.specialty || "");
                }
            }).catch((error) => {
                console.error("خطأ في جلب بيانات الطبيب:", error);
            });
        }

        // التبديل بين النماذج
        function showRegisterSection() {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('register-section').style.display = 'block';
        }

        function showLoginSection() {
            document.getElementById('register-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }

        // تسجيل الدخول
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    alert("خطأ في تسجيل الدخول: " + error.message);
                });
        }

        // إنشاء حساب جديد وحفظ بياناته في Firestore
        function handleRegister(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value;
            const specialty = document.getElementById('reg-specialty').value;
            const phone = document.getElementById('reg-phone').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    return db.collection('doctors').doc(user.uid).set({
                        fullName: name,
                        specialty: specialty,
                        phone: phone,
                        email: email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    alert("تم إنشاء حساب العيادة وتسجيل الدخول بنجاح!");
                })
                .catch((error) => {
                    alert("خطأ في إنشاء الحساب: " + error.message);
                });
        }

        // تسجيل الخروج
        function handleLogout() {
            auth.signOut().then(() => {
                // سيقوم مراقبة الحالة onAuthStateChanged بإعادة توجيه المستخدم تلقائياً لواجهة الدخول
            }).catch((error) => {
                console.error("خطأ أثناء تسجيل الخروج:", error);
            });
        }
    </script>
</body>
</html>
