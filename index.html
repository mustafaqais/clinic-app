<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Master System - Cloud Ultimate Edition v16.51</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: #eef2f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .mobile-container { background: #ffffff; width: 100%; max-width: 430px; min-height: 100vh; box-shadow: 0 15px 35px rgba(15, 23, 42, 0.12); display: flex; flex-direction: column; }
        .auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px 20px; flex: 1; text-align: center; }
        .activ-icon { font-size: 50px; color: #0d9488; margin-bottom: 15px; }
        .activ-title { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
        .auth-form { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: left; }
        .field-label { font-size: 0.82rem; color: #475569; margin-bottom: 6px; font-weight: 700; display: block; }
        .input-wrapper { background-color: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 4px 10px; }
        .input-wrapper input { width: 100%; border: none; outline: none; padding: 8px 0; font-size: 0.92rem; font-weight: 600; color: #0f172a; background: transparent; }
        .btn-main { width: 100%; background: #0d9488; color: white; border: none; border-radius: 14px; padding: 14px; font-size: 0.98rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .header { background: #0f172a; color: white; padding: 25px; text-align: center; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; }
        .content { padding: 20px; flex: 1; }
        .menu-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="authScreen" class="auth-screen">
        <div class="activ-icon"><i class="fa-solid fa-user-doctor"></i></div>
        <div class="activ-title">تسجيل الدخول المستقر</div>
        <p style="color: #64748b; font-size: 0.85rem;" id="systemStatus">النظام جاهز</p>

        <div class="auth-form">
            <div class="field-box">
                <span class="field-label">البريد الإلكتروني</span>
                <div class="input-wrapper"><input type="email" id="authEmail" value="musqaqa009@gmail.com"></div>
            </div>
            <div class="field-box">
                <span class="field-label">كلمة المرور</span>
                <div class="input-wrapper"><input type="password" id="authPassword" placeholder="أدخل كلمة المرور"></div>
            </div>
            <button type="button" class="btn-main" onclick="executeLogin()">تسجيل الدخول</button>
        </div>
    </div>

    <div id="appContainer" style="display: none; flex: 1; flex-direction: column;">
        <div class="header">
            <h2>لوحة تحكم العيادة</h2>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">مرحباً بالمهندس قيس</p>
        </div>
        <div class="content">
            <div class="menu-card" onclick="alert('واجهة المرضى قيد التشغيل المستقر')">
                <i class="fa-solid fa-user-plus" style="font-size: 24px; color: #0d9488;"></i>
                <div>
                    <h3>إدارة المرضى والسجلات</h3>
                    <p style="font-size: 0.75rem; color: #64748b;">النظام يعمل بدون جمود</p>
                </div>
            </div>
            <button class="btn-main" style="background: #ef4444; margin-top: 30px;" onclick="executeLogout()">تسجيل الخروج</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCgS-TYiCiVIjUrPSkf_z4U837v8LoRUMY",
        authDomain: "mustafaqais-31e2c.firebaseapp.com",
        projectId: "mustafaqais-31e2c",
        storageBucket: "mustafaqais-31e2c.firebasestorage.app",
        messagingSenderId: "835445727081",
        appId: "1:835445727081:web:f5ba7a8d8a241fcbe627f8",
        measurementId: "G-DL042BQE94"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const FOUNDER_EMAIL = "musqaqa009@gmail.com";

    auth.onAuthStateChanged(user => {
        if (user && user.email.toLowerCase() === FOUNDER_EMAIL.toLowerCase()) {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';
        }
    });

    function executeLogin() {
        const email = document.getElementById('authEmail').value.trim();
        const pass = document.getElementById('authPassword').value;

        if (!pass) {
            alert('الرجاء إدخال كلمة المرور!');
            return;
        }

        document.getElementById('systemStatus').innerText = "جاري المصادقة السريعة...";

        auth.signInWithEmailAndPassword(email, pass)
            .then((res) => {
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'flex';
            })
            .catch((error) => {
                document.getElementById('systemStatus').innerText = "النظام جاهز";
                alert('فشل تسجيل الدخول:\n' + error.message);
            });
    }

    function executeLogout() {
        auth.signOut().then(() => {
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('authScreen').style.display = 'flex';
        });
    }
</script>

</body>
</html>
